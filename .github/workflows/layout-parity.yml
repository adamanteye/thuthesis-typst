name: LaTeX layout parity
on:
  pull_request:
    paths:
      - ".github/workflows/layout-parity.yml"
      - ".justfile"
      - "contrib/**"
      - "scripts/**"
      - "src/**"
      - "template/**"
      - "typst.toml"
      - "tests/visual/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-fonts:
    name: Prepare Typst fonts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download open fonts
        run: bash scripts/fonts.sh fonts
      - uses: actions/upload-artifact@v7
        with:
          name: typst-fonts
          path: fonts
          if-no-files-found: error
          retention-days: 1
  layout-parity:
    name: ${{ matrix.degree }}-${{ matrix.language }}-${{ matrix.output }}
    needs: prepare-fonts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: texlive/texlive:latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        degree: [bachelor, master, doctor, postdoc]
        language: [chinese, english]
        output: [electronic, print]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tuna/thuthesis
          ref: b50ce596c248964fe04f317a8fe9b1a0f6b34174
          path: latex-reference
      - name: Install xz
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xz-utils
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - uses: extractions/setup-just@v4
      - uses: actions/download-artifact@v8
        with:
          name: typst-fonts
          path: fonts
      - name: Build original PDFs
        run: |
          just parity \
            "${{ matrix.degree }}" \
            "${{ matrix.language }}" \
            "${{ matrix.output }}" \
            latex-reference \
            build/artifacts
      - name: Upload case bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-parity-case-${{ matrix.degree }}-${{ matrix.language }}-${{ matrix.output }}
          path: build/artifacts/**/*.pdf
          if-no-files-found: error
          retention-days: 1
  merge-comparisons:
    name: Merge comparison bundles
    needs: layout-parity
    if: ${{ always() && needs.layout-parity.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge case artifacts
        id: merge
        uses: actions/upload-artifact/merge@v7
        with:
          name: layout-parity-review
          pattern: layout-parity-case-*
          delete-merged: true
          retention-days: 7
          compression-level: 0
      - name: Link original PDFs
        env:
          GITHUB_ARTIFACT_URL: ${{ steps.merge.outputs.artifact-url }}
        run: |
          echo "[Download original LaTeX and Typst PDFs]($GITHUB_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
