name: Render nightly thesis

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "template/**"
      - "typst.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build.yml"
  pull_request:
    types: [opened, edited, synchronize]
    paths:
      - "src/**"
      - "template/**"
      - "typst.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  render-paper:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --no-update-lock-file --command bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}

      - name: Render Bachelor Thesis
        run: |
          ./template/thesis.typ --root .. bachelor-academic.pdf
          ./template/thesis.typ --root .. bachelor-academic-anonymous.pdf --input anonymous=true
          ./template/thesis.typ --root .. bachelor-academic-twoside.pdf --input twoside=true
          ./template/thesis.typ --root .. bachelor-academic-anonymous-twoside.pdf --input anonymous=true --input twoside=true

      - name: Render Master Thesis
        run: |
          ./template/thesis.typ --root .. master-academic.pdf --input degree=master
          ./template/thesis.typ --root .. master-academic-anonymous.pdf --input degree=master --input anonymous=true
          ./template/thesis.typ --root .. master-academic-twoside.pdf --input degree=master --input twoside=true
          ./template/thesis.typ --root .. master-academic-anonymous-twoside.pdf --input degree=master --input anonymous=true --input twoside=true

      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: thesis
          path: |
            bachelor-academic.pdf
            bachelor-academic-anonymous.pdf
            bachelor-academic-twoside.pdf
            bachelor-academic-anonymous-twoside.pdf

            master-academic.pdf
            master-academic-anonymous.pdf
            master-academic-twoside.pdf
            master-academic-anonymous-twoside.pdf
