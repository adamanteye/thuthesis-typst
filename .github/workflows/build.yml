name: Render nightly thesis
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "template/**"
      - "assets/**"
      - "typst.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build.yml"
  pull_request:
    types: [opened, edited, synchronize]
    paths:
      - "src/**"
      - "template/**"
      - "assets/**"
      - "typst.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:
jobs:
  render-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Install Nix
        uses: cachix/install-nix-action@fd24c48048070c1be9acd18c9d369a83f0fe94d7 # v31.8.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install open fonts
        run: |
          nix build --no-update-lock-file .#open-fonts -o "$RUNNER_TEMP/fonts"
          echo "TYPST_FONT_PATHS=$RUNNER_TEMP/fonts" >> "$GITHUB_ENV"
          echo "TYPST_IGNORE_SYSTEM_FONTS=true" >> "$GITHUB_ENV"
      - name: Render templates
        run: |
          mkdir -p build/nightly
          for language in chinese english; do
            typst compile --root . --input "language=$language" template/thesis.typ "build/nightly/thesis-$language.pdf"
          done
      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: thesis
          path: build/nightly/*.pdf
          if-no-files-found: error
